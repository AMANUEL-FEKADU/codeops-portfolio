<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        section{
            border: 1px solid black;
            width: 180px;
            margin: 10px;
            text-align: center;
            border-radius: 10px;
        }
        #sec1{
            background-color: rgb(0, 255, 255);
        }
        #sec1h{
            background-color: hsl(180, 100%, 50%);
        }
        #sec1h:hover{
            background-color: hsl(180, 100%, 80%);
        }

             #sec2{
            background-color: rgb(165, 42, 42);
        }
           #sec2h{
            background-color:hsl(0, 59%, 41%);
        }
        #sec2h:hover{
            background-color: hsl(0, 59%, 61%);
        }
        
        #sec3{
            background-color: rgb(255, 165, 0);
        }
        #sec3h{
            background-color:hsl(39, 100%, 50%);
        }
        #sec3h:hover{
            background-color: hsl(39, 100%, 60%);
        }
          
    </style>
</head>
<body>
    <h2>Aqua</h2>
    <section id="sec1">
        #00FFFF
    </section>
     <section id="sec1h">
        hsl(180, 100%, 50%)
    </section>
    <h2>Brown</h2>
    <section id="sec2">#A52A2A</section>
    <section id="sec2h">hsl(0, 59%, 41%)</section>
    <p>orange</p>
    <section id="sec3">#FFA500</section>
     <section id="sec3h">hsl(39, 100%, 50%)</section>
</body>
</html>
