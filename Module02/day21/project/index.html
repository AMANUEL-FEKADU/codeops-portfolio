<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        span{
            display: none;
        }
        body{
            display: flex;
            justify-content: center;
            background-color: rgb(22, 22, 22);
            flex-direction: column;
        }
        form{
            color: aliceblue;
            border: 1px solid gray;
            padding: 20px;
            border-radius: 15px;
            
        }
        button{
            background-color: salmon;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            color: aliceblue;
            font-weight: 700;
            

        }

        h1{
            color: aliceblue;
        }


        
    </style>
</head>
<body>
    <form action="">
        <label for="name">Name</label>
        <input type="text" id="name"><br> <br>
        <label for="em">Email</label>
        <input type="email" id="em"> <br>
        <span id="emalert"> email is in the wrong format</span> <br>
        <label for="ph">Phone no</label>
        <input type="tel" id="ph"> <br>
        <span id="phalert"> phone pattern doesnt match the ethiopian pattern</span> <br>
        <label for="pwd">Password</label>
        <input type="password" id="pwd"> <br>
        <span id="pwdalert"> password must have atleast 1 uppercase letter 1lowercase letter 1special character</span> <br> <br>
        <button>submit</button>
    </form>
      <br> 
      <h1 id="count"></h1>
    <script src="script.js"></script>
</body>
</html>
