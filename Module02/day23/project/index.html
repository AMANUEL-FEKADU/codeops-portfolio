<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moola</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
    <link rel="stylesheet" href="style.css">
    
</head>
<body>

    <header>
        <figure>
            <a href="">
                <span class="logo-mark">₹</span>
            </a>
        </figure>
        <h1>Moola</h1>
    </header>

    <div class="left-side">

        <main class="main-container">
            <section class="welcome">
                <h2>Welcome back to moola</h2>
                <span>your finance companion</span>
            </section>
            <section class="balance">
                <div>
                    <h3>Balance status <span style="color:#C98A3E;">- active</span></h3>
                    <span>you current balance</span>
                    <h4 id="total"></h4>
                </div>
                <div class="info">
                    <h1>Moola</h1>
                    <span>track you finance with moola</span>
                </div>
            </section>

            <section class="transaction">
            </section>
        </main>

        <aside class="sidebar">
            <h2>transaction</h2>
            <form action="" id="transction">
                <input type="number" placeholder="enter amount" id="amt">
                <select name="" id="cur">
                </select>
                <select name="" id="catagory">
                </select>
                <div>
                    <button class="income" id="income">income</button>
                    <button class="expence" id="expence">expence</button>
                </div>
            </form>

            
        </aside>

        <aside class="top-spending-card">
    <h2>Top Spending</h2>
    
    <div class="spending-list" id="top-spending-list"></div>
</aside>
    </div>

    <footer class="footer">
        <p>Moola.com</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
