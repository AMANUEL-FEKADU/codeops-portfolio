<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @font-face {
            font-family: 'square';
            src: url('Square.ttf');
        }
        body{
            background-image: url('Gradient7.jpg');
            
        }
        img{
            border-radius: 50%;
            width: 40%;
          
        }
        header{
            display: flex;
            margin-bottom: 5%;
            background-color: #00f5d41c;
            border: 1px solid rgba(0, 0, 0, 0.315);
            border-radius: 25px;
            margin: auto;
            font-family: 'square';
            color:rgb(255, 254, 254);


        }
        header h1{
            margin-left: -25%;
            font-size: medium;
            align-self: center;
        }
        section{
            border: 1px solid black;
            margin: 6%;
            padding: 2%;
            border-radius: 0.8em;
        }
        .balance h3{
            margin-bottom: -1%;

        }
        .balance span{
            color: gray;
        }
        .balance{
            display: flex;
            font-family: 'square';
            color: white;
            background-color: rgb(53, 76, 88);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(20px);
            
            
            
        }
        .balance div{
            /* border: 1px solid black; */
            flex: 1;
        }
        .balance img{
            width: 60px;
            height: 60px;
            margin-top: 20px;
            margin-right: -30px;
            /* border: 1px solid violet; */
        }
        .transaction{
            background-color: #39b5e650;
        }
        .transaction div{
            font-family: 'square';
            display: flex;
            justify-content: space-around;
            align-items: center;
            border: 1px solid black;
            margin-bottom: 2%;
            border-radius: 15px;
            background-color: #43424452;
        }
        .transaction button{
            height: 30px;
            background-color: rgba(185, 36, 16, 0.904);
        }
         .transaction p{
            color: white;
            background-color: #059669;
         }
         .transaction h4{
            background-color: rgb(2, 2, 2);
         }
        .inc{
            color: #059669;
        }
        .exp{
            color: #E63946;
        }
        footer{
            font-family: 'square';
        }
        .sidebar{
            border: 1px solid black;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            color: white;
            font-family: 'square';
            justify-content: center;
            align-items: center;
            padding: 2%;
            background-color: #05966836;
          
        }
        
        .sidebar div{
            display: flex;
            justify-content: center;
            gap: 2%;
            margin-top: 3%;
            
        }
        .income{
            background-color: #059669;
            font-family: 'square';
            color: white;
        }
        .expence{
            background-color: #E63946;
            font-family: 'square';
            color: white;
        }
        @media (min-width:320px){
            body{
                background-image: url('gradien.png');
            }
            header h1{
            margin-left: -18%;
            font-size: medium;
            align-self: center;
        }
    }
        @media (min-width:640px){
            body{
                background-image: url('gradien.png');
            }
            header h1{
            margin-left: -12%;
            font-size: medium;
            align-self: center;
        }
            
        }
        @media (min-width:320px){
            body{
                background-image: url('gradient.png');
            }
        }
            header h1{
            margin-left: -10%;
            font-size: medium;
            align-self: center;
        }
        .left-side {
        display: grid;
        grid-template-columns: 2fr 1fr;
        align-items: start;
        gap: 1.5rem;
    }
        .sidebar{
            margin-top: 12%;
            height: 40%;
        }
         .balance img{
            width: 80px;
            height: 80px;
            margin-top: 10px;
            margin-right: 5px;
            /* border: 1px solid violet; */
        }

        @media (min-width: 1024px) {
             header h1{
            margin-left: -7%;
            font-size: medium;
            align-self: center;
        }
    .left-side, header, footer {
        max-width: 1100px;
        margin-left: auto;
        margin-right: auto;
    }
    
    .left-side {
        gap: 2.5rem; 
    }
    .balance img{
            width: 100px;
            height: 100px;
            margin-top: 15px;
            margin-right: 55px;
            /* border: 1px solid violet; */
        }
    .balance{
            
            padding-bottom: 45px;
        }
}
    </style>
</head>
<body>
    
    <header>
        <figure>
            <a href="">
                <img src="logo.png" alt=" a circle logo haveing an icon of ruppee in the middle">
            </a>
        </figure>
        <h1>Moola</h1>
    </header>
 <div class="left-side">

    <main class="main-container">
            <section  class="balance">
                <div>
                <h3>Balance status</h3>
                <span>you current balance</span>
                <h4>2500 ETB</h4>
                </div>
                <figure>
                    <img src="bir.jpg" alt="">
                </figure>

            </section>

            <section class="transaction">

                <div>
                    <h3>🍗</h3>
                    <p>eating out</p>
                    <h4 class="exp">-200 ETB</h4>
                    <button>🗑</button>

                </div>
                <div >
                    <h3>💰</h3>
                    <p>freelance</p>
                    <h4 class="inc">+3500 ETB</h4>
                    <button>🗑</button>

                </div>

                <div>
                    <h3>🚕</h3>
                    <p>transport</p>
                    <h4 class="exp">-400 ETB</h4>
                    <button>🗑</button>

                </div>

                
                <div>
                    <h3>💰</h3>
                    <p>salary</p>
                    <h4 class="inc">+2500 ETB</h4>
                    <button>🗑</button>

                </div>

                <div >
                    <h3>🏠</h3>
                    <p>rent</p>
                    <h4 class="exp">-1500 ETB</h4>
                    <button>🗑</button>

                </div>

            </section>
    </main>

    <aside class="sidebar">
        <h2>transaction</h2>
        <form action="" id="transction">
            <input type="number" placeholder="enter amount">
            <select name="" id="cur">
                <option value="">ETB</option>
            </select>
            <div>
                <button class="income">income</button>
                <button class="expence">expence</button>
            </div>

        </form>

    </aside>
</div>

<footer class="footer">
    <p>Moola.com</p>

</footer>
</body>
</html>
