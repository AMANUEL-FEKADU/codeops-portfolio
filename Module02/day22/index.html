<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            /* background: linear-gradient(180rad, rgb(19, 18, 18), rgb(114, 115, 117)); */
            background-color: rgba(22, 22, 22, 0.87);
        }
        h1{
            color: rgb(240, 200, 93);
            font-family:Verdana, Geneva, Tahoma, sans-serif;
            text-align: center;
        }
        header{
            border: 2px solid rgba(27, 209, 164, 0.596) ;
            border-radius: 20px;
            margin: 10px;
            background-color: rgba(0, 255, 255, 0.329);
        }
        main{
            margin-top: 20px;
          margin-left: 30%;
        }
        .del{
            background-color: tomato;
            font-weight: 600;
            color: white;
            border-style: groove;
        }
        .del:hover{
            background-color: rgba(255, 99, 71, 0.466);

        }

        #add{
            background-color: rgba(28, 24, 252, 0.308);

            font-weight: 800;
            color: white;
        }
        #resu{
            text-align: center;
            border: 1px solid white;
            padding: 10px;
            width: 50%;
            border-radius: 20px;
            color: rgb(0, 255, 149);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(20px);
            background-color: rgba(240, 248, 255, 0.267);
        }
        #page{
            color: aliceblue;
            border: 1px solid rgb(50, 120, 122);
            text-align: center;
            width: 50%;
            margin: auto;
            background-color: rgba(63, 248, 7, 0.233);
            border-radius: 15px;
        }
        input{
            height: 30px;
        }
        #currency{
            height: 33px;
        }
        #conv{
            height: 33px;
        }
        #main{
            margin: auto;
        }
       
    </style>
</head>

    <main>
        <section id="main">
            <input type="number" id="amount" placeholder="place the amount">
            <select name="" id="currency">

            </select>
            <button id="conv">convert</button>  <br>
            <h2 for="" id="resu">
                result...
            </h2> <br>
            
        </section>
    </main>

    <section id="page">

    </section>    
    <script src="script.js"></script>
